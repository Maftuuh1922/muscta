name: muscta_app
description: "MUSCTA - Music Social Media App like Instagram for music lovers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^8.0.0
  injectable: ^2.4.4
  
  # Navigation
  go_router: ^14.6.1
  
  # Network & API
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.5
  http: ^1.1.0
  
  # Firebase (Auth & Storage)
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  
  # Database & Storage - Local storage only for now
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Music & Audio
  audioplayers: ^6.1.0
  just_audio: ^0.9.40
  audio_waveforms: ^1.0.5
  
  # Image & Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  photo_manager: ^3.0.0
  photo_manager_image_provider: ^2.0.0
  
  # Real-time & Chat
  socket_io_client: ^2.0.3+1
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  url_launcher: ^6.2.1
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  crypto: ^3.0.5
  
  # Animation & Effects
  flutter_staggered_animations: ^1.1.1
  animations: ^2.0.11
  rive: ^0.13.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  retrofit_generator: ^8.2.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  
  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
